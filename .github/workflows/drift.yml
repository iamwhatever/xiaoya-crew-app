name: Template drift

# Rebuilds the bundled templates against KiroCrew main and fails if they differ.
# Weekly, so a change to KiroCrew's default.html surfaces without blocking
# unrelated PRs; and on PRs that touch the template sources, so an edit to the
# stage files cannot land without the rebuilt template.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "dev/build.py"
      - "dev/stage.*"
      - "xiaoya/templates/**"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kirodotdev/KiroCrew
          ref: main
          path: KiroCrew
          sparse-checkout: src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python dev/build.py --check KiroCrew/src
